<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* fonte vem do theme.css (Geist) */
  body {
    background: var(--c-bg);
    color: var(--c-text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- REPORT HEADER (título de página, padrão shadcn) ---------- */
  .report-header {
    background: transparent;
    color: var(--c-text);
    padding: 26px 28px 2px;
  }
  .report-header-inner {
    max-width: 1344px; margin: 0 auto;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px 24px; flex-wrap: wrap;
  }
  .report-eyebrow {
    font-size: 12px; font-weight: 500; letter-spacing: .05em;
    color: var(--c-text-muted); text-transform: uppercase; margin-bottom: 6px;
  }
  .report-title {
    font-size: 24px; font-weight: 600;
    letter-spacing: -0.025em; line-height: 1.2; color: var(--c-text);
  }
  .report-subtitle {
    font-size: 14px; color: var(--c-text-muted);
    margin-top: 4px; font-weight: 400;
  }
  .report-date {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500; color: var(--c-text-muted);
    white-space: nowrap; padding-bottom: 2px;
  }
  .report-date .ui-ico { width: 15px; height: 15px; }

  /* ---------- MAIN ---------- */
  main {
    max-width: 1400px; margin: 0 auto;
    padding: 20px 28px 8px;
  }

  /* ---------- KPI ROW (SectionCards do shadcn) ---------- */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: linear-gradient(to top, color-mix(in srgb, var(--c-primary) 4%, var(--c-surface)), var(--c-surface));
    border: 1px solid var(--sv-line, var(--c-border));
    border-radius: 14px;
    box-shadow: var(--shadow-xs);
    padding: 16px 18px;
    position: relative;
    transition: border-color .15s, box-shadow .15s;
  }
  .kpi-card:hover { border-color: var(--c-border-strong); }
  .kpi-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 6px; min-height: 26px;
  }
  .kpi-label {
    font-size: 12.5px; font-weight: 500;
    color: var(--c-text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-ico {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    display: grid; place-items: center;
    color: var(--c-text-muted); background: var(--c-bg);
    border: 1px solid var(--c-border);
  }
  .kpi-ico .ui-ico { width: 14px; height: 14px; }
  .kpi-value {
    font-size: 28px; font-weight: 600;
    letter-spacing: -0.035em; line-height: 1.15;
    color: var(--c-text);
    font-variant-numeric: tabular-nums;
  }
  .kpi-value.is-danger { color: var(--c-danger); }
  .kpi-sub {
    font-size: 12px; color: var(--c-text-muted);
    margin-top: 4px;
  }

  /* ---------- CARDS (pipeline + mapa + vagas) ---------- */
  .two-col {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .panel {
    background: var(--c-surface);
    border: 1px solid var(--sv-line, var(--c-border));
    border-radius: 14px;
    box-shadow: var(--shadow-xs);
    overflow: hidden;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .panel-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding: 16px 20px 12px;
  }
  .section-title {
    font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
    color: var(--c-text);
    display: flex; align-items: center; gap: 8px;
  }
  .section-sub {
    font-size: 12.5px; color: var(--c-text-muted); margin-top: 2px;
  }
  .section-sub strong { color: var(--c-text); font-weight: 500; }
  .table-scroll { overflow-x: auto; }

  /* Tabelas (Table do shadcn): cabeçalho discreto, linhas com hover suave */
  table.country-table,
  table.aging-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.country-table th,
  table.aging-table th {
    text-align: left;
    padding: 10px 12px;
    font-size: 12.5px; font-weight: 500;
    color: var(--c-text-muted);
    background: transparent;
    border-top: 1px solid var(--sv-line, var(--c-border));
    border-bottom: 1px solid var(--sv-line, var(--c-border));
    white-space: nowrap;
  }
  table.country-table td,
  table.aging-table td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--sv-line-2, var(--c-border));
    font-variant-numeric: tabular-nums;
    color: var(--c-text);
    vertical-align: middle;
  }
  table.country-table th:first-child, table.country-table td:first-child,
  table.aging-table th:first-child, table.aging-table td:first-child { padding-left: 20px; }
  table.country-table th:last-child, table.country-table td:last-child,
  table.aging-table th:last-child, table.aging-table td:last-child { padding-right: 20px; }
  table.country-table tbody tr,
  table.aging-table tbody tr { transition: background .12s; }
  table.country-table tbody tr:hover td,
  table.aging-table tbody tr:hover td { background: var(--c-bg); }
  table.aging-table tbody tr:last-child td { border-bottom: none; }
  th.num, td.num { text-align: right !important; }
  td.is-zero { color: var(--c-text-dim); }
  td.highlight { font-weight: 600; color: var(--c-text); }
  td.warn-num { font-weight: 600; color: var(--c-warn); }

  /* ---------- COUNTRY TABLE ---------- */
  table.country-table td.country-cell {
    font-weight: 500; white-space: nowrap;
  }
  table.country-table tbody tr.totals td {
    background: var(--c-bg);
    font-weight: 600;
    border-bottom: none;
    color: var(--c-text);
  }
  .country-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
    margin-right: 9px; vertical-align: 0.05em;
    box-shadow: 0 0 0 1px rgba(15,23,42,.08);
  }

  /* ---------- MAP ---------- */
  .map-wrap {
    flex: 1; display: flex; flex-direction: column;
    padding: 0 16px 16px; min-height: 0;
  }
  #map {
    flex: 1;
    min-height: 340px;
    background: var(--c-bg);
  }
  .leaflet-container { background: var(--c-bg-tint); font-family: var(--font-sans); }
  /* Zoom do Leaflet = botões outline (funciona no dark) */
  #map .leaflet-bar { border: 1px solid var(--c-border) !important; border-radius: 8px !important; box-shadow: var(--shadow-sm) !important; overflow: hidden; }
  #map .leaflet-bar a { background: var(--c-surface); color: var(--c-text); border-bottom-color: var(--c-border); width: 28px; height: 28px; line-height: 28px; }
  #map .leaflet-bar a:hover { background: var(--c-bg); }
  /* Tooltip das bolhas = popover do shadcn */
  #map .leaflet-tooltip {
    background: var(--c-surface); color: var(--c-text);
    border: 1px solid var(--c-border); border-radius: 10px;
    box-shadow: var(--shadow-md); padding: 10px 12px;
    font-family: var(--font-sans);
  }
  #map .leaflet-tooltip-top::before { border-top-color: var(--c-surface); }
  .rs-tip-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--c-text); margin-bottom: 6px; }
  .rs-tip-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12.5px; line-height: 1.7; color: var(--c-text-muted); }
  .rs-tip-row b { color: var(--c-text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- AGING TABLE ---------- */
  .aging-section { margin-bottom: 8px; }
  .count-badge {
    display: inline-flex; align-items: center; height: 20px; padding: 0 7px;
    border-radius: 6px; font-size: 12px; font-weight: 500; letter-spacing: 0;
    background: var(--c-bg); color: var(--c-text-muted); border: 1px solid var(--c-border);
    font-variant-numeric: tabular-nums;
  }
  /* Badge do shadcn (retangular, borda tingida) */
  .rs-badge {
    display: inline-flex; align-items: center; gap: 6px;
    height: 22px; padding: 0 8px; border-radius: 6px;
    font-size: 12px; font-weight: 500; line-height: 1;
    border: 1px solid; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rs-badge .b-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .rs-badge--success { background: rgba(22,163,74,.08); color: #15803D; border-color: rgba(22,163,74,.22); }
  .rs-badge--warn    { background: rgba(202,138,4,.09); color: #A16207; border-color: rgba(202,138,4,.25); }
  .rs-badge--danger  { background: rgba(185,28,28,.07); color: #B91C1C; border-color: rgba(185,28,28,.22); }
  .rs-badge--info    { background: var(--c-bg-tint); color: var(--c-primary-dark); border-color: rgba(74,159,224,.25); }
  .rs-badge--neutral { background: var(--c-bg); color: var(--c-text-muted); border-color: var(--c-border); }
  [data-theme="dark"] .rs-badge--success { color: #4ADE80; background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.25); }
  [data-theme="dark"] .rs-badge--warn    { color: #FBBF24; background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.28); }
  [data-theme="dark"] .rs-badge--danger  { color: #F87171; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.28); }
  .days-fresh { color: var(--c-text-muted); }
  .city-name { font-weight: 500; color: var(--c-text); }
  .remarks-cell { color: var(--c-text-muted); font-size: 13px; min-width: 200px; }

  /* Empty state */
  .empty-row td { padding: 0 !important; }
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 44px 20px; text-align: center; }
  .empty-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--c-bg); border: 1px solid var(--c-border); color: var(--c-text-muted); }
  .empty-ico .ui-ico { width: 18px; height: 18px; }
  .empty-t { font-size: 14px; font-weight: 600; color: var(--c-text); }

  /* ---------- LOADING/ERROR ---------- */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 20px; color: var(--c-text-muted); font-size: 13px; font-weight: 500; }
  .spinner {
    display: inline-block; width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid color-mix(in srgb, var(--c-text) 12%, transparent);
    border-top-color: var(--c-text);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    display: flex; align-items: flex-start; gap: 10px;
    background: rgba(185,28,28,.06); color: var(--c-danger);
    padding: 14px 16px; border-radius: 10px;
    font-size: 13.5px; border: 1px solid rgba(185,28,28,.22);
  }
  [data-theme="dark"] .error-box { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.28); color: #F87171; }

  /* ---------- FOOTER ---------- */
  footer.report-footer {
    width: calc(100% - 56px); max-width: 1344px;
    margin: 24px auto 0;
    border-top: 1px solid var(--sv-line, var(--c-border));
    padding: 16px 0 28px;
    background: transparent;
    color: var(--c-text-dim);
    font-size: 12px;
    display: flex; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .kpi-card, table.country-table tbody tr, table.aging-table tbody tr { transition: none; }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 1180px) {
    .two-col { grid-template-columns: 1fr; }
    #map { min-height: 320px; }
  }
  @media (max-width: 980px) {
    .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 680px) {
    .report-header { padding: 20px 16px 2px; }
    main { padding: 16px 16px 8px; }
    footer.report-footer { width: calc(100% - 32px); }
    .kpi-row { gap: 10px; }
    .kpi-card { padding: 14px; }
    .kpi-value { font-size: 24px; }
    .report-title { font-size: 22px; }
    table.aging-table th:nth-child(6),
    table.aging-table td:nth-child(6) { display: none; }
  }

  /* ---------- PRINT ---------- */
  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    body { background: white !important; }
    header.topbar, footer.report-footer { display: none !important; }
    .theme-toggle-btn { display: none !important; }
    .report-header { padding: 0 0 8px; }
    main { padding: 8px 0; max-width: none; }
    .panel, .kpi-card { box-shadow: none !important; background: #fff !important; }
    .two-col { gap: 8px; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); }
    #map { min-height: 280px; }
    table.aging-table tbody tr:hover td { background: transparent !important; }
  }
</style>

</head>

let currentLang = 'pt';
let currentUser = null;
let recruitmentData = null;
let mapInstance = null;
let mapBubbles = [];

function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || I18N.pt[key] || key; }

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  applyI18n();
  if (recruitmentData) renderContent();
}

function applyI18n() {
  // Atualiza só os elementos do CONTEÚDO da página
  // (topbar é gerenciado pelo common.js, login screen idem)
  const el = (id) => document.getElementById(id);
  if (el('report-eyebrow'))  el('report-eyebrow').textContent  = t('reportEyebrow');
  if (el('report-title'))    el('report-title').textContent    = t('reportTitle');
  if (el('report-subtitle')) el('report-subtitle').textContent = t('reportSubtitle');
  if (el('loading-text'))    el('loading-text').textContent    = t('loadingText');
  if (el('footer-left'))     el('footer-left').textContent     = t('footerLeft');
  if (el('footer-right'))    el('footer-right').textContent    = t('footerRight');
  document.documentElement.lang = currentLang;
}

function startApp(user) {
  currentUser = user;
  injectTopbar({
    region: 'LATAM · RECRUITMENT STATUS',
    user: user,
    showBack: true,
    showLangSwitch: true,
    lang: currentLang,
    onLangChange: (newLang) => { setLang(newLang); },
    onRefresh: () => loadData(true),
    extras: [{
      html: '🖨 PDF',
      onClick: () => window.print(),
      className: 'primary',
    }],
  });
  document.getElementById('app').style.display = '';
  if (typeof setupThemeToggle === 'function') setupThemeToggle(user);
  loadData();
}

// ---------- LOAD DATA ----------
async function loadData(forceRefresh) {
  try {
    const url = CONFIG.scriptUrl + '?action=getRecruitmentData';
    const res = (typeof cachedFetch === 'function')
      ? await cachedFetch(url, 300, { forceRefresh: !!forceRefresh })
      : await fetch(url).then(r => r.json());
    if (!res.success) throw new Error(res.error || 'Erro do backend');
    recruitmentData = res.data;
    renderContent();
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="error-box">' + uiIcon('alert') + '<span>Erro ao carregar dados: ' + escapeHtml(err.message) + '</span></div>';
  }
}

// ---------- RENDER ----------
function renderContent() {
  if (!recruitmentData) return;
  const demand = recruitmentData.demand || [];
  const summary = recruitmentData.summary || [];
  const summaryByCountry = {};
  summary.forEach(s => { summaryByCountry[s.country] = s; });

  // KPIs
  const totalOpen = demand.length;
  const totalActive = summary.reduce((acc, s) => acc + (s.currentlyActive || 0), 0);
  const totalHired = summary.reduce((acc, s) => acc + (s.hired || 0), 0);
  const stuck = demand.filter(d => {
    const days = computeDaysOpen(d.raisedOn);
    return days !== null && days >= 30;
  }).length;

  // Aging-sorted demand
  const demandWithAge = demand.map(d => ({
    ...d, daysOpen: computeDaysOpen(d.raisedOn)
  })).sort((a, b) => (b.daysOpen || 0) - (a.daysOpen || 0));

  // Update report date
  const now = new Date();
  const locale = currentLang === 'pt' ? 'pt-BR' : currentLang === 'es' ? 'es-ES' : 'en-US';
  document.getElementById('report-date').innerHTML =
    `${uiIcon('calendar')}<span>${now.toLocaleDateString(locale, { day: '2-digit', month: 'long', year: 'numeric' })}</span>`;

  // Célula numérica (alinhada à direita; zero fica apagado — padrão shadcn)
  const numCell = (v, extraCls) => {
    const n = v || 0;
    const cls = ['num', n === 0 ? 'is-zero' : (extraCls || '')].filter(Boolean).join(' ');
    return `<td class="${cls}">${n}</td>`;
  };
  // KPI (SectionCards do shadcn): rótulo + ícone discreto, valor grande, sub
  const kpiCard = (label, value, sub, ico, valueCls) => {
    const icoSvg = ico ? uiIcon(ico) : '';
    return `
      <div class="kpi-card">
        <div class="kpi-head"><div class="kpi-label">${label}</div>${icoSvg ? `<span class="kpi-ico">${icoSvg}</span>` : ''}</div>
        <div class="kpi-value${valueCls ? ' ' + valueCls : ''}">${value}</div>
        <div class="kpi-sub">${sub}</div>
      </div>`;
  };

  // Build content
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="kpi-row">
      ${kpiCard(t('kpiOpen'), totalOpen, t('kpiOpenSub'), 'search')}
      ${kpiCard(t('kpiActive'), totalActive, t('kpiActiveSub'), 'car')}
      ${kpiCard(t('kpiHired'), totalHired, t('kpiHiredSub'), 'users')}
      ${kpiCard(t('kpiStuck'), stuck, t('kpiStuckSub'), 'hourglass', stuck > 0 ? 'is-danger' : '')}
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-head">
          <div class="section-title">${t('sectionByCountry')}</div>
        </div>
        <div class="table-scroll"><table class="country-table">
          <thead><tr>
            <th>${t('colCountry')}</th>
            <th class="num">${t('colOpen')}</th>
            <th class="num">${t('colShort')}</th>
            <th class="num">${t('colActive')}</th>
            <th class="num">${t('colTraining')}</th>
            <th class="num">${t('colOffboarding')}</th>
          </tr></thead>
          <tbody>
            ${COUNTRY_ORDER.filter(c => summaryByCountry[c]).map(c => {
              const s = summaryByCountry[c];
              const color = COUNTRY_COLOR[c] || 'var(--c-accent)';
              return `<tr>
                <td class="country-cell"><span class="country-dot" style="background:${color}"></span>${escapeHtml(c)}</td>
                ${numCell(s.open, 'highlight')}
                ${numCell(s.shortlisted)}
                ${numCell(s.currentlyActive)}
                ${numCell(s.training)}
                ${numCell(s.offboarding, 'warn-num')}
              </tr>`;
            }).join('')}
            <tr class="totals">
              <td>${t('total')}</td>
              <td class="num">${totalOpen}</td>
              <td class="num">${summary.reduce((a, s) => a + (s.shortlisted || 0), 0)}</td>
              <td class="num">${totalActive}</td>
              <td class="num">${summary.reduce((a, s) => a + (s.training || 0), 0)}</td>
              <td class="num">${summary.reduce((a, s) => a + (s.offboarding || 0), 0)}</td>
            </tr>
          </tbody>
        </table></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="section-title">${t('sectionMap')}</div>
            <div class="section-sub">${t('mapBubbleSize')}: <strong>${t('equalsOpenPositions')}</strong></div>
          </div>
        </div>
        <div class="map-wrap"><div id="map"></div></div>
      </div>
    </div>

    <div class="aging-section panel">
      <div class="panel-head">
        <div class="section-title">${t('sectionAging')} <span class="count-badge">${totalOpen}</span></div>
      </div>
      <div class="table-scroll"><table class="aging-table">
        <thead><tr>
          <th>${t('colCountry')}</th>
          <th>${t('colCity')}</th>
          <th>${t('colStatus')}</th>
          <th>${t('colRaisedOn')}</th>
          <th class="num">${t('colDaysOpen')}</th>
          <th>${t('colRemarks')}</th>
        </tr></thead>
        <tbody>
          ${demandWithAge.length === 0
            ? `<tr class="empty-row"><td colspan="6"><div class="empty-state"><span class="empty-ico">${uiIcon('checkCircle')}</span><div class="empty-t">${t('noOpen')}</div></div></td></tr>`
            : demandWithAge.map(d => {
                const sk = (d.status || '').toLowerCase();
                // Badge semântico: aberta = success · em pausa = warn · pré-selecionado = info · em andamento = neutral
                let pillCls = 'rs-badge--success', label = t('statusOpen');
                if (sk === 'on hold') { pillCls = 'rs-badge--warn'; label = t('statusOnHold'); }
                else if (sk === 'shortlisted') { pillCls = 'rs-badge--info'; label = t('statusShortlisted'); }
                else if (sk === 'in progress') { pillCls = 'rs-badge--neutral'; label = t('statusInProgress'); }
                const isOld = d.daysOpen !== null && d.daysOpen >= 30;
                const color = COUNTRY_COLOR[d.country] || 'var(--c-accent)';
                const daysTxt = d.daysOpen !== null ? d.daysOpen + 'd' : '—';
                return `<tr>
                  <td class="country-cell"><span class="country-dot" style="background:${color}"></span>${escapeHtml(d.country)}</td>
                  <td class="city-name">${escapeHtml(d.city || '—')}</td>
                  <td><span class="rs-badge ${pillCls}"><span class="b-dot"></span>${label}</span></td>
                  <td>${formatDate(d.raisedOn, locale)}</td>
                  <td class="num">${isOld ? `<span class="rs-badge rs-badge--danger">${daysTxt}</span>` : `<span class="days-fresh">${daysTxt}</span>`}</td>
                  <td class="remarks-cell">${escapeHtml(d.remarks || '—')}</td>
                </tr>`;
              }).join('')
          }
        </tbody>
      </table></div>
    </div>
  `;

  // Build map
  renderMap(summaryByCountry);
}

function renderMap(summaryByCountry) {
  // Destroy existing instance
  if (mapInstance) {
    mapInstance.remove();
    mapInstance = null;
    mapBubbles = [];
  }

  const mapEl = document.getElementById('map');
  if (!mapEl) return;

  mapInstance = L.map(mapEl, {
    zoomControl: true, attributionControl: true,
    scrollWheelZoom: false,
  }).setView([-15, -70], 3);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 10,
  }).addTo(mapInstance);

  // Compute max for bubble scaling
  const maxOpen = Math.max(1, ...Object.values(summaryByCountry).map(s => s.open || 0));

  COUNTRY_ORDER.forEach(country => {
    const s = summaryByCountry[country];
    const centroid = COUNTRY_CENTROID[country];
    if (!s || !centroid) return;
    const open = s.open || 0;
    const color = COUNTRY_COLOR[country] || '#4A9FE0';
    const radius = open > 0 ? 12 + (open / maxOpen) * 22 : 8;

    const marker = L.circleMarker(centroid, {
      radius: radius,
      fillColor: color,
      color: 'white',
      weight: 2,
      opacity: 1,
      fillOpacity: open > 0 ? 0.75 : 0.25,
    }).addTo(mapInstance);

    const popupHtml = `
      <div>
        <div class="rs-tip-title">${escapeHtml(country)}</div>
        <div class="rs-tip-row"><span>${t('colOpen')}</span><b>${open}</b></div>
        <div class="rs-tip-row"><span>${t('colActive')}</span><b>${s.currentlyActive || 0}</b></div>
        <div class="rs-tip-row"><span>${t('colHired')}</span><b>${s.hired || 0}</b></div>
      </div>
    `;
    marker.bindTooltip(popupHtml, { permanent: false, direction: 'top', opacity: 0.95 });

    // Permanent label with the number (if open > 0)
    if (open > 0) {
      const label = L.divIcon({
        className: 'map-bubble-label',
        html: `<div style="color: white; font-weight: 800; font-size: ${open >= 10 ? 11 : 13}px; text-shadow: 0 1px 2px rgba(0,0,0,0.4); pointer-events: none; text-align: center; width: ${radius*2}px; margin-left: -${radius}px; margin-top: -7px;">${open}</div>`,
        iconSize: [0, 0],
        iconAnchor: [0, 0],
      });
      L.marker(centroid, { icon: label, interactive: false }).addTo(mapInstance);
    }
    mapBubbles.push(marker);
  });

  // Fit LATAM
  mapInstance.fitBounds([[-55, -118], [33, -34]], { padding: [10, 10] });
}

// ---------- HELPERS ----------
function computeDaysOpen(raisedOn) {
  if (!raisedOn) return null;
  let d;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raisedOn)) {
    d = new Date(raisedOn + 'T00:00:00');
  } else if (/^\d{2}\/\d{2}\/\d{4}$/.test(raisedOn)) {
    const [day, mo, yr] = raisedOn.split('/').map(Number);
    d = new Date(yr, mo - 1, day);
  } else {
    d = new Date(raisedOn);
  }
  if (isNaN(d.getTime())) return null;
  const diff = Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
  return diff >= 0 ? diff : null;
}

function formatDate(s, locale) {
  if (!s) return '—';
  let d;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) d = new Date(s + 'T00:00:00');
  else if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) {
    const [day, mo, yr] = s.split('/').map(Number);
    d = new Date(yr, mo - 1, day);
  } else d = new Date(s);
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString(locale, { day: '2-digit', month: '2-digit', year: '2-digit' });
}

// Ícone lucide do kit (ui.js); vazio se o kit ainda não carregou
function uiIcon(name) {
  return (window.UI && typeof window.UI.icon === 'function') ? window.UI.icon(name) : '';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', () => {
  applyI18n();
  injectLogin({
    title: 'Recruitment Status',
    sub: 'Acesso interno',
    lang: currentLang,
    onSuccess: startApp,
  });
});
</script>
