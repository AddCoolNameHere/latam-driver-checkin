<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SV LATAM · Motoristas</title>
<meta name="description" content="App dos motoristas Street View LATAM: check-in, equipamentos, cash e documentos.">
<meta name="theme-color" content="#F8FAFC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../aceolution-globe.png">
<link rel="apple-touch-icon" href="../aceolution-globe-hd.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SV LATAM">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="../theme.css?v=20261023toggle">
<script>
  // App de motorista = sempre light (igual às páginas de motorista): não
  // carrega theme.js, senão herda o dark de um admin no mesmo browser.
  document.documentElement.removeAttribute('data-theme');
</script>
<style>
/* ============================================================
 * App do motorista — /app/
 * Casca única (login + início + barra de abas) em volta das 5
 * páginas de motorista, que rodam em iframes com ?app=1
 * (ver ../driver-embed.js). Tokens do theme.css; sempre light.
 * ============================================================ */
:root {
  --top-h: 56px;
  --nav-h: 64px;
  --bump: 20px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --card-r: 16px;
  --grad: linear-gradient(140deg, #1A365D 0%, #2C5282 55%, #4A9FE0 120%);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--c-bg);
  color: var(--c-text);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.4;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: 12px;
  font-weight: 650; font-size: 15px; white-space: nowrap;
  transition: transform .12s var(--ease-out), background .15s, box-shadow .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--c-primary); color: #fff; box-shadow: 0 6px 16px rgba(44,82,130,.28); }
.btn-primary:disabled { opacity: .6; box-shadow: none; }
.btn-soft { background: var(--c-bg-tint); color: var(--c-primary); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }

/* ============================================================
 * LOGIN
 * ============================================================ */
.login {
  position: fixed; inset: 0; overflow-y: auto;
  background: var(--c-bg);
  display: flex; flex-direction: column;
}
.login-top {
  position: relative; overflow: hidden;
  background: var(--grad); color: #fff;
  padding: calc(var(--sat) + 22px) 24px 84px;
}
.login-top::after {
  content: ""; position: absolute; right: -70px; top: 30px;
  width: 260px; height: 260px; border-radius: 50%;
  background: url("../aceolution-globe-hd.png") center/contain no-repeat;
  opacity: .14; pointer-events: none;
}
.login-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
.login-logo { height: 26px; width: auto; }
.lang-pills { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.16); }
.lang-pills button { font-size: 12px; font-weight: 650; padding: 5px 10px; border-radius: 999px; color: rgba(255,255,255,.85); }
.lang-pills button.active { background: #fff; color: var(--c-primary-dark); }
.login-kicker { font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.login-top h1 { font-size: 30px; line-height: 1.12; font-weight: 750; letter-spacing: -.02em; margin: 8px 0 10px; max-width: 320px; }
.login-top p { font-size: 15px; opacity: .88; max-width: 320px; }
.login-card {
  position: relative; z-index: 1;
  margin: -56px 16px 24px; padding: 22px 20px 20px;
  background: var(--c-surface); border-radius: 20px;
  border: 1px solid var(--c-border); box-shadow: var(--shadow-lg);
  max-width: 460px; align-self: center; width: calc(100% - 32px);
}
.login-card label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
.email-field {
  display: flex; align-items: center; min-width: 0;
  border: 1.5px solid var(--c-border-strong); border-radius: 12px; background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.email-field:focus-within { border-color: var(--c-accent); box-shadow: 0 0 0 4px var(--ring); }
.email-field input {
  flex: 1; min-width: 0; height: 50px; padding: 0 0 0 14px;
  border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 16px; color: var(--c-text);
}
.email-domain { flex: none; padding: 0 12px 0 2px; color: var(--c-text-muted); font-size: 12.5px; max-width: 56%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.login-hint { font-size: 12.5px; color: var(--c-text-muted); margin: 8px 2px 16px; }
.login-error {
  font-size: 13.5px; color: var(--c-danger); background: #FEF2F2; border: 1px solid #FECACA;
  border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
}
.login-foot { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 12.5px; color: var(--c-text-muted); margin-top: 14px; }
.login-foot svg.ic { width: 16px; height: 16px; color: var(--c-success); }

/* ============================================================
 * CASCA DO APP
 * ============================================================ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  height: calc(var(--top-h) + var(--sat));
  padding: var(--sat) 14px 0 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(248,250,252,.9);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--c-border); }
.tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-globe { width: 28px; height: 28px; flex: none; }
.tb-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title small { display: block; font-size: 11px; font-weight: 600; color: var(--c-text-muted); letter-spacing: .08em; text-transform: uppercase; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--grad); color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .02em;
  box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(26,54,93,.25);
}

#views {
  position: fixed; left: 0; right: 0;
  top: calc(var(--top-h) + var(--sat));
  bottom: calc(var(--nav-h) + var(--sab));
}
.view {
  position: absolute; inset: 0;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .18s var(--ease-out), visibility 0s linear .18s;
}
.view.active { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .18s var(--ease-out); }

/* Abas com iframe: termina acima da "corcova" do botão de check-in, pra ela
 * não cobrir botão nenhum da página embutida. */
.view-frame { bottom: var(--bump); display: flex; flex-direction: column; }
.frame-wrap { position: relative; flex: 1; min-height: 0; }
.frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--c-bg); }
.frame-load {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  background: var(--c-bg); color: var(--c-text-muted); font-size: 14px;
  transition: opacity .2s;
}
.frame-wrap.ready .frame-load { opacity: 0; pointer-events: none; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--c-border); border-top-color: var(--c-accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Cash ↔ Divergencias (só Argentina) */
.seg { flex: none; padding: 10px 16px 4px; }
.seg-inner { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 12px; background: #E9EEF5; max-width: 520px; margin: 0 auto; }
.seg button { height: 34px; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--c-text-muted); }
.seg button.active { background: #fff; color: var(--c-primary-dark); box-shadow: var(--shadow-sm); }

/* ---------- Barra de abas ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + var(--sab));
  padding-bottom: var(--sab);
  /* No computador não estica: as 5 abas ficam numa faixa de até 560px. */
  padding-left: max(0px, calc((100vw - 560px) / 2));
  padding-right: max(0px, calc((100vw - 560px) / 2));
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(255,255,255,.94);
  -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
  border-top: 1px solid var(--c-border);
  box-shadow: 0 -6px 24px rgba(15,23,42,.05);
}
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 11px; font-weight: 600; color: var(--c-text-dim);
  transition: color .15s;
}
.tab svg.ic { width: 24px; height: 24px; transition: transform .2s var(--ease-spring); }
.tab.active { color: var(--c-primary); }
.tab.active svg.ic { stroke-width: 2.2; transform: translateY(-1px); }
.tab:active svg.ic { transform: scale(.88); }
.tab-dot {
  position: absolute; top: 9px; left: calc(50% + 8px);
  width: 9px; height: 9px; border-radius: 50%;
  background: #EF4444; box-shadow: 0 0 0 2px #fff;
}

/* Check-in: o botão principal, maior e "saltado" da barra */
.tab-main { justify-content: flex-end; padding-bottom: 8px; color: var(--c-primary-dark); font-weight: 750; }
.tab-main.active { color: var(--c-primary-dark); }
.fab {
  position: absolute; left: 50%; top: calc(-1 * var(--bump) - 2px);
  width: 62px; height: 62px; margin-left: -31px; border-radius: 50%;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(150deg, #4A9FE0 0%, #2C5282 58%, #1A365D 100%);
  box-shadow: 0 0 0 5px var(--c-bg), 0 10px 24px rgba(44,82,130,.45);
  transition: transform .18s var(--ease-spring), box-shadow .2s;
}
.fab svg.ic { width: 30px; height: 30px; stroke-width: 2.2; }
.tab-main:active .fab { transform: scale(.92); }
.tab-main.active .fab { box-shadow: 0 0 0 5px var(--c-bg), 0 0 0 8px rgba(74,159,224,.35), 0 10px 24px rgba(44,82,130,.45); }
.fab.pending::before {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  border: 2px solid rgba(74,159,224,.7);
  animation: pulse 2.2s var(--ease-out) infinite;
}
@keyframes pulse { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.38); opacity: 0; } }
.fab-ok {
  position: absolute; right: -2px; top: -2px;
  width: 20px; height: 20px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-success); color: #fff; box-shadow: 0 0 0 2px #fff;
}
.fab-ok svg.ic { width: 13px; height: 13px; stroke-width: 3; }
.tab-main .tab-lbl { position: relative; z-index: 1; }

@media (prefers-reduced-motion: reduce) {
  .fab.pending::before { animation: none; }
  .view, .view.active { transition: none; }
}

/* ============================================================
 * INÍCIO
 * ============================================================ */
.home-scroll {
  position: absolute; inset: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
}
.home { max-width: 560px; margin: 0 auto; padding: 8px 16px 28px; }

.hero {
  position: relative; overflow: hidden;
  border-radius: 22px; padding: 20px 20px 64px;
  background: var(--grad); color: #fff;
  box-shadow: 0 14px 30px rgba(26,54,93,.25);
}
.hero::after {
  content: ""; position: absolute; right: -54px; bottom: -64px;
  width: 210px; height: 210px; border-radius: 50%;
  background: url("../aceolution-globe-hd.png") center/contain no-repeat;
  opacity: .16; pointer-events: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hero-date { font-size: 13px; opacity: .85; }
.hero-hello { font-size: 27px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; position: relative; z-index: 1; }
.chip-glass {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22);
}
.chip-glass svg.ic { width: 14px; height: 14px; }
.refresh {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: rgba(255,255,255,.14); color: #fff;
}
.refresh svg.ic { width: 15px; height: 15px; }
.refresh.spinning svg.ic { animation: spin .9s linear infinite; }

/* Cartão "Hoje" — encaixado na base do hero */
.today {
  position: relative; z-index: 2;
  margin: -48px 10px 0; padding: 16px;
  display: flex; align-items: center; gap: 14px;
  background: var(--c-surface); border-radius: 18px;
  border: 1px solid var(--c-border); box-shadow: var(--shadow-lg);
}
.today-ic { width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center; }
.today-ic svg.ic { width: 26px; height: 26px; }
.today.pending .today-ic { background: #FEF3C7; color: #B45309; }
.today.done .today-ic { background: #DCFCE7; color: #15803D; }
.today.closed .today-ic { background: var(--c-bg-tint); color: var(--c-primary); }
.today.vacation .today-ic { background: #CCFBF1; font-size: 26px; line-height: 1; }
.today-txt { flex: 1; min-width: 0; }
.today-title { font-weight: 700; font-size: 15.5px; line-height: 1.25; }
.today-sub { font-size: 13px; color: var(--c-text-muted); margin-top: 2px; }
.today-sync { display: inline-block; font-size: 11.5px; font-weight: 650; color: var(--c-warn); }
.today .btn { flex: none; }
.today-wide { flex-wrap: wrap; }
.today-wide .btn { width: 100%; }

.notice {
  display: flex; gap: 10px; align-items: flex-start;
  margin-top: 14px; padding: 10px 12px; border-radius: 12px;
  background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E; font-size: 13px;
}
.notice svg.ic { width: 18px; height: 18px; margin-top: 1px; }

.section-title {
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--c-text-muted); margin: 22px 4px 10px;
}
.card {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--card-r); box-shadow: var(--shadow-sm);
  padding: 16px; margin-bottom: 12px;
}
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--c-bg-tint); color: var(--c-primary); }
.card-ic svg.ic { width: 18px; height: 18px; }
.card-t { font-weight: 700; font-size: 15.5px; flex: 1; min-width: 0; }
.card-meta { font-size: 12px; color: var(--c-text-muted); }

/* Onde você está */
.base-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px 6px 8px; border-radius: 999px; font-weight: 700; font-size: 14px;
}
.base-badge svg.ic { width: 18px; height: 18px; }
.base-badge.home { background: #DCFCE7; color: #166534; }
.base-badge.hotel { background: #EDE9FE; color: #5B21B6; }
.base-addr { margin-top: 10px; font-size: 14.5px; line-height: 1.4; }
.base-meta { margin-top: 4px; font-size: 12.5px; color: var(--c-text-muted); }
.map-box {
  position: relative; margin-top: 12px; height: 150px; border-radius: 12px; overflow: hidden;
  background: #E9EEF5; border: 1px solid var(--c-border);
}
.map-box .leaflet-container { width: 100%; height: 100%; background: #E9EEF5; font: inherit; }
.map-box .leaflet-control-attribution { font-size: 9px; }
.map-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--c-text-muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08); }
.last-area { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--c-border); }
.last-area svg.ic { width: 18px; height: 18px; color: var(--c-accent); margin-top: 1px; }
.last-area b { display: block; font-size: 12px; color: var(--c-text-muted); font-weight: 600; }
.last-area div { font-size: 14px; }
.map-link { color: var(--c-primary); font-weight: 600; font-size: 12.5px; text-decoration: none; white-space: nowrap; }

/* Discos */
.disk-inuse {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 12px;
  background: linear-gradient(135deg, #F0FDF4, #ECFDF5); border: 1px solid #BBF7D0;
}
.disk-inuse .disk-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: #16A34A; color: #fff; flex: none; }
.disk-inuse .disk-ic svg.ic { width: 20px; height: 20px; }
.disk-inuse small { display: block; font-size: 11.5px; font-weight: 700; color: #15803D; text-transform: uppercase; letter-spacing: .06em; }
.disk-inuse .mono { font-size: 15px; font-weight: 600; word-break: break-all; }
.disk-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.disk-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 9px; font-size: 13px;
  background: var(--c-bg); border: 1px solid var(--c-border);
}
.disk-chip svg.ic { width: 14px; height: 14px; color: var(--c-text-dim); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; margin-top: 12px; border-top: 1px dashed var(--c-border); font-size: 13.5px; }
.kv span { color: var(--c-text-muted); display: inline-flex; align-items: center; gap: 6px; }
.kv span svg.ic { width: 16px; height: 16px; }
.kv b { font-weight: 650; }
.empty { font-size: 13.5px; color: var(--c-text-muted); }

/* Pendências */
.todo { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.todo + .todo { border-top: 1px solid var(--c-border); }
.todo:first-of-type { padding-top: 2px; }
.todo-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.todo-ic svg.ic { width: 18px; height: 18px; }
.todo.ok .todo-ic { background: #DCFCE7; color: #15803D; }
.todo.warn .todo-ic { background: #FEF3C7; color: #B45309; }
.todo.bad .todo-ic { background: #FEE2E2; color: #B91C1C; }
.todo-txt { flex: 1; min-width: 0; }
.todo-t { font-weight: 650; font-size: 14.5px; }
.todo-s { font-size: 12.5px; color: var(--c-text-muted); margin-top: 1px; }

/* Números do mês */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stat { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--card-r); box-shadow: var(--shadow-sm); padding: 14px 16px; }
.stat-n { font-size: 26px; font-weight: 750; letter-spacing: -.02em; color: var(--c-primary-dark); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 12.5px; color: var(--c-text-muted); margin-top: 4px; }

.foot { text-align: center; font-size: 11.5px; color: var(--c-text-dim); margin: 18px 0 4px; }

/* Esqueleto enquanto o primeiro resumo não chega */
.sk { border-radius: 10px; background: linear-gradient(90deg, #EEF2F7 25%, #F6F8FB 37%, #EEF2F7 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ============================================================
 * PERFIL (bottom sheet)
 * ============================================================ */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.42); opacity: 0; transition: opacity .2s; }
.sheet-bg.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-width: 560px; margin: 0 auto;
  background: var(--c-surface); border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(20px + var(--sab));
  box-shadow: 0 -12px 40px rgba(15,23,42,.18);
  transform: translateY(105%); transition: transform .26s var(--ease-out);
}
.sheet.open { transform: translateY(0); }
.sheet-grab { width: 40px; height: 5px; border-radius: 999px; background: var(--c-border-strong); margin: 0 auto 16px; }
.sheet-who { display: flex; align-items: center; gap: 14px; }
.sheet-who .avatar { width: 54px; height: 54px; font-size: 19px; box-shadow: none; }
.sheet-name { font-size: 18px; font-weight: 750; }
.sheet-mail { font-size: 13px; color: var(--c-text-muted); word-break: break-all; }
.sheet-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--c-border); margin-top: 14px; }
.sheet-row + .sheet-row { margin-top: 0; }
.sheet-row > span { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; }
.sheet-row > span svg.ic { color: var(--c-text-muted); }
.lang-seg { display: inline-flex; padding: 3px; border-radius: 10px; background: #E9EEF5; }
.lang-seg button { font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; color: var(--c-text-muted); }
.lang-seg button.active { background: #fff; color: var(--c-primary-dark); box-shadow: var(--shadow-sm); }
.sheet-hint { font-size: 12.5px; color: var(--c-text-muted); line-height: 1.45; }
.btn-out { width: 100%; margin-top: 8px; height: 46px; border-radius: 12px; font-weight: 650; color: var(--c-danger); background: #FEF2F2; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-out.confirm { background: var(--c-danger); color: #fff; }

.wk-bg { position: fixed; inset: 0; z-index: 60; background: rgba(15,23,42,.5); opacity: 0; transition: opacity .2s; }
.wk-bg.open { opacity: 1; }
.wk-modal {

// ================================================================
// UTILITÁRIOS
// ================================================================
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function lsJson(k, fallback) { try { const v = JSON.parse(lsGet(k) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; } }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function norm(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}
function pad(n) { return String(n).padStart(2, '0'); }
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function toDate(v) { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; }

function t(key, vars) {
  const dict = I18N[S.lang] || I18N.pt;
  let s = dict[key];
  if (s == null) s = I18N.pt[key];
  if (s == null) return key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function fmtTime(d) { return d.toLocaleTimeString(LOCALE[S.lang], { hour: '2-digit', minute: '2-digit' }); }
function fmtDay(d) { return d.toLocaleDateString(LOCALE[S.lang], { day: '2-digit', month: '2-digit' }); }
function ago(d) {
  if (!d) return '';
  const diff = Date.now() - d.getTime();
  const min = Math.round(diff / 60000);
  if (min < 2) return t('agoNow');
  if (min < 60) return t('agoMin', { n: min });
  const now = new Date();
  if (dayKey(d) === dayKey(now)) return diff < 6 * 3600000 ? t('agoHour', { n: Math.round(min / 60) }) : t('agoToday');
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (dayKey(d) === dayKey(y)) return t('agoYesterday');
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return t('agoDays', { n: Math.max(2, Math.round((b - a) / 86400000)) });
}
function country(c) { return COUNTRIES[norm(c)] || null; }
function countryName(c) { const m = country(c); return m ? (m[S.lang] || m.pt) : String(c || ''); }
function isAR() { return !!S.session && norm(S.session.country) === 'argentina'; }
/** Situation "Vacation" na HR (vem no getDrivers a partir do backend v5.84). */
function onVacation() { return !!S.session && /vacation|ferias|vacaciones/.test(norm(S.session.situation)); }
function firstName(name) {
  const w = String(name || '').trim().split(/\s+/)[0] || '';
  return w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : '';
}
function initials(name) {
  const p = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function defaultLangFor(c) {
  if (!String(c || '').trim()) return browserLang();   // sem país na HR: vai pelo idioma do celular
  return norm(c) === 'brazil' || norm(c) === 'brasil' ? 'pt' : 'es';
}
function browserLang() {
  const l = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
  return l.startsWith('pt') ? 'pt' : l.startsWith('en') ? 'en' : 'es';
}

/** GET no backend com timeout. Lança se a resposta não for {success:true}. */
async function api(params, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 25000);
  try {
    const res = await fetch(API + '?' + new URLSearchParams(params).toString(), { signal: ctrl.signal });
    const data = await res.json();
    if (!data || data.success === false) throw new Error((data && data.error) || 'resposta inválida');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function showLogin() {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('login-foot-ic').innerHTML = ic('shield');
  applyStaticI18n();
  updateDomainHint();
}

function updateDomainHint() {
  const v = document.getElementById('login-email').value;
  document.getElementById('email-domain').classList.toggle('hidden', v.includes('@'));
}

function loginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.classList.toggle('hidden', !msg);
}

function findDriver(list, email) {
  if (!Array.isArray(list)) return null;
  return list.find(d => d && String(d.email || '').trim().toLowerCase() === email) || null;
}

async function doLogin(ev) {
  ev.preventDefault();
  const input = document.getElementById('login-email');
  let email = input.value.trim().toLowerCase().replace(/\s+/g, '');
  if (!email) { loginError(t('loginEmpty')); input.focus(); return; }
  if (!email.includes('@')) email += '@' + CFG.domain;

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = t('loginChecking');
  loginError('');

  let list = null;
  let driver = null;
  try {
    const data = await api({ action: 'getDrivers' });
    list = data.drivers;
    lsSet(KEYS.drivers, JSON.stringify(list));
    driver = findDriver(list, email);
    // Motorista recém-cadastrado pode não estar na cópia do cache: fura o cache uma vez.
    if (!driver) {
      try { driver = findDriver((await api({ action: 'getDrivers', nocache: '1' })).drivers, email); } catch (e) {}
    }
  } catch (err) {
    console.warn('[Driver App] getDrivers falhou no login, tentando a lista salva:', err);
    list = lsJson(KEYS.drivers, null);
    driver = findDriver(list, email);
    if (!driver && !list) {
      btn.disabled = false;
      btn.textContent = t('loginBtn');
      loginError(t('loginOffline'));
      return;
    }
  }

  btn.disabled = false;
  btn.textContent = t('loginBtn');
  if (!driver) { loginError(t('loginNotFound')); return; }

  S.session = {
    email: String(driver.email).trim(),
    name: String(driver.name || '').trim(),
    country: String(driver.country || '').trim(),
    city: String(driver.city || '').trim(),
    situation: String(driver.situation || '').trim(),   // "Vacation" = de férias (backend v5.84+)
    at: Date.now(),
  };
  lsSet(KEYS.session, JSON.stringify(S.session));
  // Idioma: se a pessoa não escolheu na tela de login, vai pelo país.
  if (!lsGet(KEYS.lang)) setLang(defaultLangFor(S.session.country), { silent: true });
  console.log('[Driver App] login ok: ' + S.session.email + ' (' + S.session.country + ')');
  showApp();
}

function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('tb-avatar').textContent = initials(S.session.name);

  S.summary = lsJson(KEYS.summary + S.session.email, null);
  S.summaryTried = false;
  renderNav();
  renderSegs();
  applyStaticI18n();

  S.gen++;
  const start = tabFromHash() || 'home';
  // Link direto pra uma aba (ex: link antigo /checkin/ → /app/#checkin): deixa a
  // home EMBAIXO no histórico, senão o "voltar" do Android fecha o app.
  history.replaceState({ tab: 'home' }, '', hashFor('home'));
  if (start !== 'home') history.pushState({ tab: start }, '', hashFor(start));
  openTab(start, { push: false, force: true });
  renderHome();

  const fresh = S.summary && (Date.now() - S.summary.at) < CFG.summaryFreshMs;
  if (!fresh) loadSummary();

  // Check-in é o que o motorista abre todo dia: pré-carrega em segundo
  // plano pra abrir instantâneo quando tocar no botão.
  clearTimeout(S.preloadTimer);
  S.preloadTimer = setTimeout(() => { if (S.session) ensureFrame('checkin'); }, 1500);
  revalidateSession();
}

/**
 * Nome/país podem mudar na HR — atualiza a sessão em silêncio.
 * Desloga só se o e-mail SUMIU da lista de motoristas (confirmado sem cache):
 * celular de projeto passado pra outro motorista não pode continuar enviando
 * check-in no nome de quem saiu. Rede falhando nunca desloga.
 */
async function revalidateSession() {
  const email = S.session && S.session.email.toLowerCase();
  if (!email) return;
  try {
    let list = (await api({ action: 'getDrivers' })).drivers;
    let d = findDriver(list, email);
    if (!d && Array.isArray(list) && list.length) {
      list = (await api({ action: 'getDrivers', nocache: '1' })).drivers;
      d = findDriver(list, email);
      if (!d && Array.isArray(list) && list.length && S.session && S.session.email.toLowerCase() === email) {
        console.warn('[Driver App] ' + email + ' não está mais na lista de motoristas — saindo');
        logout();
        return;
      }
    }
    if (!d || !S.session || S.session.email.toLowerCase() !== email) return;
    const next = { ...S.session, name: String(d.name || '').trim() || S.session.name,
      country: String(d.country || '').trim() || S.session.country, city: String(d.city || '').trim(),
      // Backend antigo não manda situation: mantém o que tinha (não "tira" a férias por engano).
      situation: d.situation !== undefined ? String(d.situation || '').trim() : (S.session.situation || '') };
    if (next.name !== S.session.name || next.country !== S.session.country || next.city !== S.session.city ||
        next.situation !== (S.session.situation || '')) {
      S.session = next;
      lsSet(KEYS.session, JSON.stringify(next));
      document.getElementById('tb-avatar').textContent = initials(next.name);
      renderNav(); renderSegs(); renderHome();
    }
  } catch (e) { /* offline — fica com o que tem */ }
}

function tabFromHash() {
  const h = location.hash.replace('#', '');
  if (!TABS[h]) return '';
  if (TABS[h].ar && !isAR()) return 'cash';
  return h;
}
function hashFor(tab) { return location.pathname + location.search + (tab === 'home' ? '' : '#' + tab); }

function renderNav() {
  const nav = document.getElementById('tabbar');
  const icons = { home: 'home', assets: 'box', checkin: 'checkin', cash: 'wallet', docs: 'id' };
  nav.innerHTML = NAV.map(id => {
    if (id === 'checkin') {
      return '<button type="button" class="tab tab-main" data-tab="checkin" aria-label="Check-in">' +
        '<span class="fab" id="fab">' + ic('checkin') + '<span class="fab-ok hidden" id="fab-ok">' + ic('check') + '</span></span>' +
        '<span class="tab-lbl" data-t="tabCheckin">' + esc(t('tabCheckin')) + '</span></button>';
    }
    return '<button type="button" class="tab" data-tab="' + id + '">' + ic(icons[id]) +
      '<span data-t="' + TABS[id].t + '">' + esc(t(TABS[id].t)) + '</span>' +
      '<span class="tab-dot hidden" id="dot-' + id + '"></span></button>';
  }).join('');
  nav.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => openTab(b.dataset.tab)));
  markNav();
}

function markNav() {
  const navTab = (TABS[S.tab] && TABS[S.tab].nav) || S.tab;
  document.querySelectorAll('#tabbar .tab').forEach(b => {
    const on = b.dataset.tab === navTab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

/** Argentina: a aba Cash tem um seletor Cash | Divergencias (as duas são "dinheiro"). */
function renderSegs() {
  ['cash', 'ardiv'].forEach(id => {
    const view = document.getElementById('view-' + id);
    let seg = view.querySelector('.seg');
    if (!isAR()) { if (seg) seg.remove(); return; }
    if (!seg) {
      seg = document.createElement('div');
      seg.className = 'seg';
      view.insertBefore(seg, view.firstChild);
    }
    seg.innerHTML = '<div class="seg-inner">' +
      '<button type="button" data-seg="cash" class="' + (id === 'cash' ? 'active' : '') + '">' + esc(t('tabCash')) + '</button>' +
      '<button type="button" data-seg="ardiv" class="' + (id === 'ardiv' ? 'active' : '') + '">' + esc(t('tabArdiv')) + '</button></div>';
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => openTab(b.dataset.seg)));
  });
}

/** Cria o iframe da aba na primeira vez; depois ele fica vivo (troca de aba é instantânea e o formulário não se perde). */
function ensureFrame(tab) {
  const def = TABS[tab];
  if (!def || !def.src) return null;
  const wrap = document.querySelector('#view-' + tab + ' .frame-wrap');
  let frame = wrap.querySelector('iframe');
  if (frame) return frame;
  wrap.classList.remove('ready');
  wrap.innerHTML = '<div class="frame-load"><div class="spinner"></div><div data-t="opening">' + esc(t('opening')) + '</div></div>';
  frame = document.createElement('iframe');
  frame.title = t(def.t);
  frame.setAttribute('allow', 'geolocation; camera');
  frame.dataset.day = dayKey(new Date());
  frame.src = def.src;
  frame.addEventListener('load', () => { frame.dataset.loaded = '1'; wrap.classList.add('ready'); });
  wrap.appendChild(frame);
  return frame;
}

/** Joga fora o iframe da aba (a próxima abertura carrega do zero). */
function dropFrame(tab) {
  const wrap = document.querySelector('#view-' + tab + ' .frame-wrap');
  if (!wrap || !wrap.querySelector('iframe')) return;
  wrap.innerHTML = '';
  wrap.classList.remove('ready');
}

/**
 * O iframe terminou de carregar mas a página NÃO subiu (sem sinal → página de
 * erro do navegador, que nem é da mesma origem). Sem isso a aba ficava presa
 * no erro pra sempre — no app instalado não tem botão de recarregar.
 */
function frameBroken(tab) {
  const f = document.querySelector('#view-' + tab + ' .frame-wrap iframe');
  if (!f || f.dataset.loaded !== '1') return false;
  try { return !(f.contentWindow && f.contentWindow.SVEmbed && f.contentWindow.SVEmbed.active); }
  catch (e) { return true; }
}

/** Página aberta num dia anterior (quinzena do AR, check-in largado pela metade ontem…). */
function frameStale(tab) {
  const f = document.querySelector('#view-' + tab + ' .frame-wrap iframe');
  return !!(f && f.dataset.day && f.dataset.day !== dayKey(new Date()));
}

/**
 * Memória: celular simples mata o navegador ao abrir a câmera se tiver muita
 * página aberta. Fica vivo só o check-in (o uso diário) + a última outra aba.
 */
function keepFrames(tab) {
  if (!TABS[tab] || !TABS[tab].src || tab === 'checkin') return;
  if (S.lastFrame && S.lastFrame !== tab) dropFrame(S.lastFrame);
  S.lastFrame = tab;
}

/** Recria as abas que quebraram (ex: voltou a internet). */
function healFrames() {
  Object.keys(TABS).forEach(tab => {
    if (TABS[tab].src && frameBroken(tab)) {
      console.log('[Driver App] aba ' + tab + ' não carregou — recarregando');
      dropFrame(tab);
      if (tab === S.tab || tab === 'checkin') ensureFrame(tab);
    }
  });
}

function openTab(tab, opts) {
  opts = opts || {};
  if (!TABS[tab]) tab = 'home';
  if (TABS[tab].ar && !isAR()) tab = 'cash';

  // Tocar de novo na aba atual = volta pro topo (como nos apps); se a página
  // quebrou ao carregar, recarrega.
  if (tab === S.tab && !opts.force) {
    if (tab === 'home') document.getElementById('home-scroll').scrollTo({ top: 0, behavior: 'smooth' });
    else if (frameBroken(tab)) { dropFrame(tab); ensureFrame(tab); }
    else {
      const f = document.querySelector('#view-' + tab + ' iframe');
      try { f && f.contentWindow.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
    }
    return;
  }

  if (TABS[tab].src && tab !== S.tab && (frameBroken(tab) || frameStale(tab))) {
    console.log('[Driver App] aba ' + tab + (frameStale(tab) ? ' é de outro dia' : ' não carregou') + ' — recarregando');
    dropFrame(tab);
  }
  S.tab = tab;
  document.querySelectorAll('#views .view').forEach(v => v.classList.toggle('active', v.id === 'view-' + tab));
  if (TABS[tab].src) { keepFrames(tab); ensureFrame(tab); }
  markNav();
  renderTitle();
  if (opts.push !== false) history.pushState({ tab }, '', hashFor(tab));

  if (tab === 'home') {
    const stale = !S.summary || (Date.now() - S.summary.at) > CFG.summaryFreshMs;
    if (stale) loadSummary();
    setTimeout(invalidateMap, 220);
  }
  checkWeeklyPrompt();
}

function renderTitle() {
  const el = document.getElementById('tb-title');
  if (S.tab === 'home') el.innerHTML = '<small>Street View</small>LATAM';
  else el.textContent = t(TABS[S.tab].t);
  document.getElementById('topbar').classList.toggle('scrolled', S.tab !== 'home' || document.getElementById('home-scroll').scrollTop > 4);
}

window.addEventListener('popstate', (e) => {
  if (!S.session) {
    // Na tela de login: "voltar" pra uma entrada #aba antiga não pode decidir
    // em que aba o PRÓXIMO login abre.
    if (location.hash) history.replaceState({}, '', location.pathname + location.search);
    return;
  }
  // Painel do perfil aberto: o "voltar" só fecha ele.
  if (S.sheetOpen) { closeSheet(true); return; }
  const tab = (e.state && e.state.tab) || tabFromHash() || 'home';
  openTab(tab, { push: false, force: true });
});

// ================================================================
// EVENTOS DAS PÁGINAS EMBUTIDAS (chamado pelo driver-embed.js)
// ================================================================
const POST_EVENTS = { checkin: 'checkin', checkout: 'checkout', base: 'base', assetWeekly: 'assets', submitDriverDocs: 'docs' };

function getEvents() {
  return S.session ? lsJson(KEYS.events + S.session.email, {}) : {};
}
function setEvent(kind, ts) {
  const ev = getEvents();
  ev[kind] = ts;
  // Limpa o que tem mais de 3 dias.
  Object.keys(ev).forEach(k => { if (Date.now() - ev[k] > 3 * 86400000) delete ev[k]; });
  lsSet(KEYS.events + S.session.email, JSON.stringify(ev));
}

window.SVApp = {
  openTab: (tab) => openTab(tab),
  onEmbedEvent(page, evt) {
    if (!evt || !S.session) return;
    if (evt.kind === 'ready') {
      const wrap = document.querySelector('#view-' + page + ' .frame-wrap');
      if (wrap) wrap.classList.add('ready');
      return;
    }
    if (evt.kind === 'post' && evt.ok) {
      const kind = POST_EVENTS[evt.type];
      if (!kind) return;
      // Envio de OUTRO motorista (ex: fila offline do check-in que sobrou no
      // aparelho de quem usava antes) não marca nada pra quem está logado.
      if (evt.email && String(evt.email).trim().toLowerCase() !== S.session.email.toLowerCase()) {
        console.warn('[Driver App] envio ' + evt.type + ' de ' + evt.email + ' ignorado no resumo');
        return;
      }
      console.log('[Driver App] ' + page + ' enviou ' + evt.type + ' — atualizando o resumo');
      setEvent(kind, Date.now());
      renderHome();
      // O check-in passa por uma fila (Worker → planilha): espera ela escoar antes de reler.
      clearTimeout(S.refreshTimer);
      S.refreshTimer = setTimeout(() => loadSummary({ force: true }), 25000);
    }
  },
};

/**
 * Lê o último relatório semanal (aba Assets Management, via getLastAssetsForm).
 *
 * ⚠ A aba tem o cabeçalho antigo do Google Forms (sem coluna de e-mail), mas o
 * assets.html grava com e-mail na coluna B — então os valores ficam UMA coluna
 * à direita do rótulo. Detecta pelo valor sob "Nome Completo" (se for e-mail,
 * está deslocado) e compensa. Se um dia o cabeçalho for corrigido, shift = 0.
 */
function parseWeekly(a) {
  if (!a || typeof a !== 'object') return null;
  const keys = Object.keys(a).filter(k => !k.startsWith('_'));
  const vals = keys.map(k => a[k]);
  const find = (re) => keys.findIndex(k => re.test(norm(k)));
  const iName = find(/nome completo|nombre/);
  const shift = (iName >= 0 && /@/.test(String(vals[iName] || ''))) ? 1 : 0;
  const at = (i) => (i >= 0 && i + shift < vals.length) ? vals[i + shift] : '';

  const iTs = find(/carimbo|timestamp/);
  const isCode = (s) => s.length >= 5 && /\d/.test(s) && /^[a-z0-9-]+$/i.test(s);
  const clean = (s) => String(s || '').trim().replace(/^sn:?\s*/i, '');
  const inUseRaw = clean(at(find(/qual disco esta usando|que disco estas usando/)));
  const inUse = isCode(inUseRaw) ? inUseRaw : '';
  const others = [];
  String(at(find(/codigos dos outros|codigos de los discos/)) || '').split(/[\s,;\/|]+/).forEach(tok => {
    const c = clean(tok);
    if (isCode(c) && c.toUpperCase() !== inUse.toUpperCase() && !others.some(o => o.toUpperCase() === c.toUpperCase())) others.push(c);
  });
  const countRaw = parseInt(String(at(find(/quantos discos|cuantos discos/)) || '').replace(/\D/g, ''), 10);
  const odoRaw = String(at(find(/odometro/)) || '').replace(/[^\d]/g, '');
  const odometer = odoRaw && odoRaw.length <= 7 ? parseInt(odoRaw, 10) : null;

  return {
    at: iTs >= 0 ? String(vals[iTs] || '') : '',
    inUse,
    others,
    count: isNaN(countRaw) ? null : countRaw,
    odometer: odometer && odometer > 0 ? odometer : null,
  };
}

function trimHistory(list) {
  return (Array.isArray(list) ? list : []).map(h => ({
    ts: h.timestamp, co: h.checkoutTimestamp || null,
    has: h.hasCheckin || 'Yes',
    area: h.destAddress || '', lat: h.destLat || null, lng: h.destLng || null,
    vs: h.vehicleStatus || '', vi: h.vehicleIssue || '',
  }));
}

async function loadSummary(opts) {
  if (!S.session || S.loading) return;
  opts = opts || {};
  S.loading = true;
  renderRefresh();

  const email = S.session.email;
  const gen = S.gen;
  const nc = opts.force ? { nocache: '1' } : {};
  const prev = S.summary || {};
  // Histórico SEM o cache do Worker (30 min) enquanto o check-in de hoje não
  // aparece: senão a home podia mostrar "pendente" com a cópia velha (ex: fez o
  // check-in no Safari e depois instalou o app) e o motorista enviava de novo.
  // Depois que aparece, volta a usar o cache (alivia o pico das 7h–9h).
  const ncHist = (opts.force || !computeToday(S.summary).ci) ? { nocache: '1' } : {};
  // Obs: a aba Vehicle Issues NÃO entra aqui — cada check-in "parado no
  // mecânico" abre uma linha nova e ninguém fecha (motorista com 15 "abertas"
  // desde julho). O status do veículo vem do último check-in (vs/vi).
  const parts = await Promise.allSettled([
    api({ action: 'getBase', email }),
    api({ action: 'getDriverHistory', email, days: '40', ...ncHist }),
    api({ action: 'getLastAssetsForm', email, ...nc }),
    api({ action: 'getDriverSsds', email }),
    api({ action: 'getDriverDocsStatus', ...nc }),
  ]);
  // Saiu (ou trocou de conta) enquanto carregava: descarta. O logout já zerou
  // S.loading, então o login novo carregou o resumo dele — não mexe em nada.
  if (S.gen !== gen) return;
  if (!S.session || S.session.email !== email) { S.loading = false; return; }
  const ok = (i) => parts[i].status === 'fulfilled' ? parts[i].value : null;
  const failed = parts.filter(p => p.status === 'rejected').length;
  if (failed) console.warn('[Driver App] resumo: ' + failed + '/' + parts.length + ' leituras falharam', parts.filter(p => p.status === 'rejected').map(p => String(p.reason)));

  const next = {
    at: Date.now(),
    base: ok(0) ? (ok(0).base || null) : (prev.base || null),
    history: ok(1) ? trimHistory(ok(1).history) : (prev.history || []),
    weekly: ok(2) ? parseWeekly(ok(2).assets) : (prev.weekly || null),
    ssds: ok(3) ? (ok(3).ssds || []) : (prev.ssds || []),
    docsAt: ok(4)
      ? ((ok(4).submissions || []).find(s => norm(s.name) === norm(S.session.name)) || {}).timestamp || null
      : (prev.docsAt || null),
  };

  S.loading = false;
  S.summaryTried = true;
  if (failed === parts.length) {
    // Tudo falhou (offline): mantém o que tinha, sem fingir que atualizou.
    S.lastError = true;
    renderHome();
    return;
  }
  S.lastError = failed > 0 && !!S.summary;
  S.summary = next;
  lsSet(KEYS.summary + email, JSON.stringify(next));
  renderHome();
}

/** Combina o histórico do servidor com o que o próprio app acabou de enviar (a fila pode atrasar a planilha). */
function computeToday(sum) {
  const tk = dayKey(new Date());
  let ci = null, co = null;
  (sum && sum.history || []).forEach(h => {
    const d = toDate(h.ts);
    if (d && h.has !== 'No' && dayKey(d) === tk && (!ci || d > ci.t)) ci = { t: d, area: h.area };
    const c = toDate(h.co);
    if (c && dayKey(c) === tk && (!co || c > co.t)) co = { t: c };
  });
  const ev = getEvents();
  const evCi = ev.checkin ? new Date(ev.checkin) : null;
  const evCo = ev.checkout ? new Date(ev.checkout) : null;
  if (!ci && evCi && dayKey(evCi) === tk) ci = { t: evCi, pending: true };
  if (!co && evCo && dayKey(evCo) === tk) co = { t: evCo, pending: true };
  return { ci, co };
}

function computeMonth(sum) {
  const now = new Date();
  const days = new Set();
  let last = null;
  (sum && sum.history || []).forEach(h => {
    const d = toDate(h.ts);
    if (!d || h.has === 'No') return;
    if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) days.add(dayKey(d));
    if (!last || d > last) last = d;
  });
  const ev = getEvents();
  if (ev.checkin) {
    const e = new Date(ev.checkin);
    if (e.getMonth() === now.getMonth() && e.getFullYear() === now.getFullYear()) days.add(dayKey(e));
    if (!last || e > last) last = e;
  }
  return { days: days.size, last };
}

function lastArea(sum) {
  const h = (sum && sum.history || []).find(x => x.area);
  return h ? { address: h.area, lat: Number(h.lat) || null, lng: Number(h.lng) || null, t: toDate(h.ts) } : null;
}

function disksOf(sum) {
  // 1º: o último relatório semanal do PRÓPRIO motorista (por e-mail). O
  // getDriverSsds (até o backend v5.83) casa pelo VID numa resposta velha do
  // Forms — às vezes os discos de quem usava o carro antes —, então só entra
  // quando o motorista nunca mandou o relatório pelo formulário novo.
  const w = sum && sum.weekly;
  if (w && (w.inUse || w.others.length)) {
    const total = Math.max(w.count || 0, (w.inUse ? 1 : 0) + w.others.length);
    return { inUse: w.inUse, others: w.others, count: total, from: toDate(w.at) };
  }
  const ssds = (sum && sum.ssds) || [];
  if (!ssds.length) return null;
  const inUse = (ssds.find(s => s.inUse) || {}).code || '';
  return { inUse, others: ssds.filter(s => !s.inUse).map(s => s.code), count: ssds.length, from: null };
}

        '<small>' + esc(t('diskInUse')) + '</small><div class="mono">' + esc(disks.inUse) + '</div></div></div>';

      html += '<div class="disk-list">' + disks.others.map(c =>

    html += '<div class="kv"><span>' + ic('gauge') + esc(t('odometer')) + '</span><b>' +

  // "Atrasado" = mais de 7 dias OU sexta 16h–23h sem o relatório de hoje (lembrete de sexta).
  const weeklyDue = weeklyDueNow(weeklyAt);
  const weeklyLate = !weeklyAt || (Date.now() - weeklyAt.getTime()) > CFG.weeklyLateDays * 86400000 || weeklyDue;

  html += '<div class="section-title">' + esc(t('todoT')) + '</div><div class="card">';

  // ---- Seu mês ----

    '</div>';

  html += '<div class="foot">' + esc(t('footer')) + '</div>';

// ================================================================
// LEMBRETE DE SEXTA (relatório semanal) — 2026-11-12
// ================================================================
/** Último relatório semanal: o da planilha ou o que este app acabou de enviar. */
function lastWeeklyAt(sum) {
  const w = sum && sum.weekly;
  let at = w ? toDate(w.at) : null;
  const ev = getEvents();
  if (ev.assets && (!at || ev.assets > at.getTime())) at = new Date(ev.assets);
  return at;
}

/** Sexta, 16h–23h no relógio do celular, sem relatório enviado HOJE (e não está de férias). */
function weeklyDueNow(at) {
  const P = CFG.weeklyPrompt;
  const now = new Date();
  if (!S.session || onVacation()) return false;
  if (now.getDay() !== P.weekday || now.getHours() < P.fromHour || now.getHours() >= P.toHour) return false;
  return !(at && dayKey(at) === dayKey(now));
}

/**
 * Abre (ou fecha) o lembrete. Chamado a cada renderHome, troca de aba, volta pro
 * app e de minuto em minuto. Só decide depois de reler o resumo (ou de um resumo
 * recente salvo) — senão piscaria pra quem já enviou de outro aparelho.
 */
function checkWeeklyPrompt() {
  if (!S.session) return;
  const known = S.summaryTried || (S.summary && (Date.now() - S.summary.at) < CFG.summaryFreshMs);
  const due = known && !S.loading && weeklyDueNow(lastWeeklyAt(S.summary));
  if (!due) { if (S.wkOpen && !S.loading) closeWeeklyPrompt(); return; }
  if (S.wkOpen || S.tab === 'assets' || document.visibilityState !== 'visible') return;
  if (Date.now() < Number(lsGet(KEYS.weeklySnooze + S.session.email) || 0)) return;
  openWeeklyPrompt();
}

function openWeeklyPrompt() {
  const m = document.getElementById('wk-modal');
  const bg = document.getElementById('wk-bg');
  m.innerHTML = '<div class="wk-ic">' + ic('clipboard') + '</div>' +
    '<div class="wk-t" id="wk-t">' + esc(t('wkT')) + '</div>' +
    '<div class="wk-s">' + esc(t('wkS')) + '</div>' +
    '<button type="button" class="btn btn-primary btn-block" id="wk-go">' + esc(t('wkGo')) + '</button>' +
    '<button type="button" class="wk-later" id="wk-later">' + esc(t('wkLater', { n: CFG.weeklyPrompt.snoozeMin })) + '</button>';
  // Os dois botões adiam: quem foi pro formulário e voltou sem enviar é lembrado de novo.
  document.getElementById('wk-go').addEventListener('click', () => { snoozeWeekly(); closeWeeklyPrompt(); openTab('assets'); });
  document.getElementById('wk-later').addEventListener('click', () => {
    console.log('[Driver App] lembrete de sexta adiado ' + CFG.weeklyPrompt.snoozeMin + ' min');
    snoozeWeekly(); closeWeeklyPrompt();
  });
  if (!S.wkOpen) console.log('[Driver App] lembrete de sexta: relatório semanal de hoje pendente');
  S.wkOpen = true;
  bg.classList.remove('hidden'); m.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => { bg.classList.add('open'); m.classList.add('open'); }));
}

function snoozeWeekly() {
  if (S.session) lsSet(KEYS.weeklySnooze + S.session.email, String(Date.now() + CFG.weeklyPrompt.snoozeMin * 60000));
}

function closeWeeklyPrompt() {
  S.wkOpen = false;
  const m = document.getElementById('wk-modal');
  const bg = document.getElementById('wk-bg');
  bg.classList.remove('open'); m.classList.remove('open');
  setTimeout(() => { if (!S.wkOpen) { bg.classList.add('hidden'); m.classList.add('hidden'); } }, 240);
}

function cap(s) { s = String(s || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

/** Status do veículo informado no check-in mais recente (OK / Minor Issue / Critical Issue). */
function lastVehicle(sum) {
  let best = null;
  (sum && sum.history || []).forEach(h => {
    const d = toDate(h.ts);
    if (!d || h.has === 'No' || !h.vs) return;
    if (!best || d > best.t) best = { t: d, vs: h.vs, vi: h.vi };
  });
  if (!best) return null;
  const v = norm(best.vs);
  return {
    t: best.t,
    status: v.includes('critical') ? 'critical' : v.includes('minor') ? 'minor' : 'ok',
    issue: String(best.vi || '').trim().slice(0, 90),
  };
}

function todoRow(level, icon, title, sub, goTab) {
  return '<div class="todo ' + level + '"><div class="todo-ic">' + ic(icon) + '</div>' +
    '<div class="todo-txt"><div class="todo-t">' + esc(title) + '</div><div class="todo-s">' + esc(sub) + '</div></div>' +
    (goTab ? '<button type="button" class="btn btn-soft btn-sm" data-go="' + goTab + '">' + esc(t('send')) + '</button>' : '') +
    '</div>';
}

function bindHome() {
  document.querySelectorAll('#home [data-go]').forEach(b => b.addEventListener('click', () => openTab(b.dataset.go)));
  const r = document.getElementById('home-refresh');
  if (r) r.addEventListener('click', () => loadSummary({ force: true }));
  renderRefresh();
}

// ---- Mini-mapa (Leaflet + OSM; carregado só quando há coordenadas) ----
let leafletPromise = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload = () => resolve(window.L);
    s.onerror = () => { leafletPromise = null; reject(new Error('leaflet')); };
    document.head.appendChild(s);
  });
  return leafletPromise;
}

function drawMap(pts) {
  loadLeaflet().then(L => {
    const box = document.getElementById('home-map');
    if (!box) return;
    if (S.map) { try { S.map.remove(); } catch (e) {} S.map = null; }
    const map = L.map(box, {
      zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
      touchZoom: false, boxZoom: false, keyboard: false, tap: false, attributionControl: true,
    });
    map.attributionControl.setPrefix('');
    // Sem CARTO: exige API key desde ago/2026. Tiles do próprio OSM.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
    pts.forEach(p => {
      L.circleMarker([p.lat, p.lng], {
        radius: p.kind === 'base' ? 8 : 7, color: '#fff', weight: 3, opacity: 1,
        fillColor: p.kind === 'base' ? '#2C5282' : '#F59E0B', fillOpacity: 1,
      }).addTo(map);
    });
    if (pts.length > 1) map.fitBounds(pts.map(p => [p.lat, p.lng]), { padding: [26, 26], maxZoom: 14 });
    else map.setView([pts[0].lat, pts[0].lng], 13);
    S.map = map;
  }).catch(() => {
    const box = document.getElementById('home-map');
    if (box) box.remove();
  });
}
function invalidateMap() { if (S.map) { try { S.map.invalidateSize(); } catch (e) {} } }

// ================================================================
// PERFIL / IDIOMA / SAIR
// ================================================================
function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

function openSheet() {
  const s = S.session;
  const cm = country(s.country);
  S.logoutArmed = false;
  let install = '';
  if (!isStandalone()) {
    install = S.installEvt
      ? '<div class="sheet-row"><span>' + ic('download') + esc(t('install')) + '</span>' +
        '<button type="button" class="btn btn-primary btn-sm" id="sheet-install">' + esc(t('install')) + '</button></div>'
      : '<div class="sheet-row"><div class="sheet-hint">' + esc(isIos() ? t('installHintIos') : t('installHintAndroid')) + '</div></div>';
  }
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = '<div class="sheet-grab"></div>' +
    '<div class="sheet-who"><div class="avatar">' + esc(initials(s.name)) + '</div><div style="min-width:0">' +
      '<div class="sheet-name">' + esc(s.name) + '</div><div class="sheet-mail">' + esc(s.email) + '</div></div></div>' +
    '<div class="sheet-row"><span>' + ic('globe') + esc(t('profileCountry')) + '</span><b>' +
      (cm ? esc(cm.flag) + ' ' : '') + esc(countryName(s.country)) + '</b></div>' +
    '<div class="sheet-row"><span>' + ic('globe') + esc(t('profileLang')) + '</span><div class="lang-seg">' +
      ['pt', 'es', 'en'].map(l => '<button type="button" data-lang="' + l + '" class="' + (l === S.lang ? 'active' : '') + '">' + l.toUpperCase() + '</button>').join('') +
    '</div></div>' + install +
    // Escape pra página que travou (sem sinal etc.): no app instalado não tem o
    // botão de recarregar do navegador nem puxar-pra-atualizar.
    '<div class="sheet-row"><span>' + ic('refresh') + esc(t('reload')) + '</span>' +
      '<button type="button" class="btn btn-soft btn-sm" id="sheet-reload">' + ic('refresh') + '</button></div>' +
    '<button type="button" class="btn-out" id="sheet-logout">' + ic('logout') + '<span>' + esc(t('logout')) + '</span></button>';

  sheet.querySelectorAll('.lang-seg button').forEach(b => b.addEventListener('click', () => { setLang(b.dataset.lang); openSheet(); }));
  const ins = document.getElementById('sheet-install');
  if (ins) ins.addEventListener('click', async () => {
    try { S.installEvt.prompt(); await S.installEvt.userChoice; } catch (e) {}
    S.installEvt = null; closeSheet();
  });
  document.getElementById('sheet-reload').addEventListener('click', () => {
    console.log('[Driver App] recarregar pedido pelo motorista');
    // Volta pro estado de base (sem a entrada do painel no histórico) e recarrega tudo.
    history.replaceState({ tab: S.tab }, '', hashFor(S.tab));
    location.reload();
  });
  document.getElementById('sheet-logout').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (!S.logoutArmed) {
      S.logoutArmed = true;
      btn.classList.add('confirm');
      btn.querySelector('span').textContent = t('logoutConfirm');
      setTimeout(() => { if (S.logoutArmed && btn.isConnected) { S.logoutArmed = false; btn.classList.remove('confirm'); btn.querySelector('span').textContent = t('logout'); } }, 4000);
      return;
    }
    logout();
  });

  const bg = document.getElementById('sheet-bg');
  bg.classList.remove('hidden'); sheet.classList.remove('hidden');
  // 2 frames: o primeiro aplica o display, o segundo dispara a transição.
  requestAnimationFrame(() => requestAnimationFrame(() => { bg.classList.add('open'); sheet.classList.add('open'); }));
  // Entra no histórico: o "voltar" do Android fecha o painel em vez de trocar de aba.
  // (openSheet é chamado de novo ao trocar idioma — só empilha na primeira vez.)
  if (!S.sheetOpen) {
    S.sheetOpen = true;
    history.pushState({ tab: S.tab, sheet: true }, '', hashFor(S.tab));
  }
}
/** fromHistory=true: já veio do "voltar" (ou é o logout) — não mexe no histórico de novo. */
function closeSheet(fromHistory) {
  const wasOpen = S.sheetOpen;
  S.sheetOpen = false;
  if (wasOpen && fromHistory !== true && history.state && history.state.sheet) history.back();
  const bg = document.getElementById('sheet-bg');
  const sheet = document.getElementById('sheet');
  bg.classList.remove('open'); sheet.classList.remove('open');
  setTimeout(() => { bg.classList.add('hidden'); sheet.classList.add('hidden'); }, 260);
}

function logout() {
  const email = S.session && S.session.email;
  console.log('[Driver App] logout: ' + email);
  lsDel(KEYS.session);
  // Idioma volta pro padrão: o próximo login cai no idioma do país dele
  // (a não ser que escolha outro na tela de login).
  lsDel(KEYS.lang);
  // Os envios recentes (events) FICAM: a chave já é por e-mail, e são eles que
  // seguram o "check-in feito" enquanto a planilha não recebeu — apagar fazia a
  // home mostrar "pendente" depois de sair e entrar de novo (e o motorista reenviava).
  if (email) lsDel(KEYS.summary + email);
  S.gen++;
  S.loading = false;
  clearTimeout(S.preloadTimer); clearTimeout(S.refreshTimer);
  S.session = null; S.summary = null; S.tab = 'home'; S.lastFrame = ''; S.summaryTried = false;
  if (S.wkOpen) closeWeeklyPrompt();
  if (S.map) { try { S.map.remove(); } catch (e) {} S.map = null; }
  document.querySelectorAll('.frame-wrap').forEach(w => { w.innerHTML = ''; w.classList.remove('ready'); });
  closeSheet(true);
  history.replaceState({}, '', location.pathname + location.search);
  document.getElementById('login-email').value = '';
  showLogin();
}

function setLang(l, opts) {
  if (!I18N[l]) return;
  S.lang = l;
  lsSet(KEYS.lang, l);
  document.documentElement.lang = LOCALE[l];
  if (opts && opts.silent) return;
  applyStaticI18n();
  if (S.session) {
    renderNav(); renderSegs(); renderTitle(); renderHome();
    if (S.wkOpen) openWeeklyPrompt();   // re-escreve o lembrete no idioma novo
    // Repassa pras páginas embutidas que já estão abertas.
    document.querySelectorAll('.frame-wrap iframe').forEach(f => {
      try { if (f.contentWindow.SVEmbed) f.contentWindow.SVEmbed.setLang(l); } catch (e) {}
    });
  }
}

function applyStaticI18n() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  document.querySelectorAll('#login-lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === S.lang));
}

// ================================================================
// BOOT
// ================================================================
(function boot() {
  const savedLang = lsGet(KEYS.lang);
  S.lang = I18N[savedLang] ? savedLang : browserLang();
  document.documentElement.lang = LOCALE[S.lang];

  document.getElementById('login-form').addEventListener('submit', doLogin);
  document.getElementById('login-email').addEventListener('input', () => { updateDomainHint(); loginError(''); });
  document.querySelectorAll('#login-lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  document.getElementById('tb-avatar').addEventListener('click', openSheet);
  document.getElementById('sheet-bg').addEventListener('click', () => closeSheet());
  document.getElementById('home-scroll').addEventListener('scroll', (e) => {
    if (S.tab === 'home') document.getElementById('topbar').classList.toggle('scrolled', e.target.scrollTop > 4);
  }, { passive: true });

  // Voltou pro app (estava em segundo plano): atualiza o resumo se envelheceu
  // e recarrega páginas abertas em outro dia (ex: check-in deixado aberto ontem).
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !S.session) return;
    Object.keys(TABS).forEach(tab => {
      if (!TABS[tab].src || !frameStale(tab)) return;
      console.log('[Driver App] aba ' + tab + ' é de outro dia — recarregando');
      dropFrame(tab);
      if (tab === S.tab || tab === 'checkin') ensureFrame(tab);
    });
    healFrames();
    if (!S.summary || (Date.now() - S.summary.at) > CFG.summaryFreshMs) loadSummary();
    else renderHome();
  });
  // Voltou a internet: abas que não carregaram tentam de novo.
  window.addEventListener('online', () => { if (S.session) healFrames(); });
  // Lembrete de sexta: confere de minuto em minuto (bate 16h com o app aberto, fim do adiamento).
  setInterval(checkWeeklyPrompt, 60000);
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); S.installEvt = e; });

  const s = lsJson(KEYS.session, null);
  if (s && s.email) {
    S.session = s;
    console.log('[Driver App] sessão lembrada: ' + s.email);
    showApp();
  } else {
    showLogin();
  }
})();
</script>
